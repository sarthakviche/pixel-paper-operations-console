<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>New Client Onboarding - Pixel &amp; Paper</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#323537",
                        "surface-container-low": "#191c1e",
                        "on-error-container": "#ffdad6",
                        "status-info": "#60A5FA",
                        "background": "#111416",
                        "on-background": "#e1e2e5",
                        "text-disabled": "#5E656D",
                        "surface-container": "#1d2022",
                        "primary-fixed-dim": "#4de082",
                        "on-primary-fixed": "#00210c",
                        "surface-container-high": "#272a2c",
                        "inverse-primary": "#006d36",
                        "error-container": "#93000a",
                        "text-muted": "#8C949C",
                        "bg-elevated": "#1B2024",
                        "surface-container-highest": "#323537",
                        "bg-secondary": "#151A1D",
                        "outline-variant": "#3d4a3e",
                        "tertiary-fixed-dim": "#73db9a",
                        "secondary": "#4ae176",
                        "surface-bright": "#37393c",
                        "on-error": "#690005",
                        "secondary-container": "#00b954",
                        "outline": "#869486",
                        "on-surface-variant": "#bccabb",
                        "primary-container": "#4ade80",
                        "secondary-fixed-dim": "#4ae176",
                        "on-secondary-fixed": "#002109",
                        "surface-tint": "#4de082",
                        "on-tertiary": "#00391d",
                        "inverse-on-surface": "#2e3133",
                        "tertiary-container": "#70d998",
                        "text-primary": "#F5F7F8",
                        "on-primary-fixed-variant": "#005227",
                        "status-danger": "#F87171",
                        "on-primary": "#003919",
                        "surface-container-lowest": "#0c0f11",
                        "tertiary-fixed": "#8ff8b4",
                        "on-tertiary-fixed-variant": "#00522d",
                        "surface-dim": "#111416",
                        "tertiary": "#8df6b2",
                        "on-secondary-container": "#004119",
                        "surface": "#111416",
                        "primary-fixed": "#6dfe9c",
                        "text-secondary": "#C8CDD1",
                        "inverse-surface": "#e1e2e5",
                        "on-primary-container": "#005e2d",
                        "border-strong": "rgba(255, 255, 255, 0.12)",
                        "border-subtle": "rgba(255, 255, 255, 0.06)",
                        "on-tertiary-container": "#005e34",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#00210f",
                        "on-secondary-fixed-variant": "#005321",
                        "secondary-fixed": "#6bff8f",
                        "on-surface": "#e1e2e5",
                        "primary": "#6bfb9a",
                        "on-secondary": "#003915",
                        "status-success": "#4ADE80",
                        "status-warning": "#FACC15"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "max-width": "1200px",
                        "gutter": "24px",
                        "scale-lg": "24px",
                        "scale-sm": "8px",
                        "scale-2xl": "48px",
                        "scale-xs": "4px",
                        "margin": "32px",
                        "scale-md": "16px",
                        "scale-xl": "32px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-xl": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "caption": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-text-primary h-screen overflow-hidden flex relative font-sans">
<!-- Background App Context (Skeleton to demonstrate overlay) -->
<div class="flex w-full h-full opacity-40 grayscale-[30%] pointer-events-none blur-[2px]">
<!-- Fake Sidebar -->
<nav class="w-[240px] h-screen border-r border-strong flex flex-col p-scale-md gap-4">
<div class="font-headline-sm text-headline-sm font-bold text-primary mb-8 px-4">Pixel &amp; Paper</div>
<div class="flex items-center gap-3 px-4 py-2 text-text-secondary"><span class="material-symbols-outlined">dashboard</span> Dashboard</div>
<div class="flex items-center gap-3 px-4 py-2 text-primary bg-secondary-container/10 rounded-lg"><span class="material-symbols-outlined">group</span> Clients</div>
</nav>
<!-- Fake Main Area -->
<div class="flex-1 flex flex-col">
<header class="h-16 w-full border-b border-strong flex justify-between items-center px-scale-lg">
<div class="text-text-muted">Clients / Overview</div>
<div class="w-8 h-8 rounded-full bg-surface-variant"></div>
</header>
<main class="p-margin">
<div class="h-64 w-full bg-bg-secondary rounded-xl border border-strong mb-gutter"></div>
<div class="grid grid-cols-3 gap-gutter">
<div class="h-48 bg-bg-secondary rounded-xl border border-strong"></div>
<div class="h-48 bg-bg-secondary rounded-xl border border-strong"></div>
<div class="h-48 bg-bg-secondary rounded-xl border border-strong"></div>
</div>
</main>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-background/80 backdrop-blur-md p-scale-md">
<!-- Modal Container (Level 2 Popover) -->
<div class="w-full max-w-2xl bg-bg-elevated border border-strong rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.3)] flex flex-col max-h-[90vh] overflow-hidden transform transition-all scale-100">
<!-- Header -->
<div class="px-margin py-scale-lg border-b border-border-subtle flex justify-between items-center shrink-0">
<div>
<h2 class="font-headline-md text-headline-md text-text-primary">Add New Client</h2>
<p class="font-body-sm text-body-sm text-text-secondary mt-1">Configure client details and brand assets.</p>
</div>
<button class="text-text-muted hover:text-text-primary transition-colors p-2 rounded-lg hover:bg-surface-variant cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">close</span>
</button>
</div>
<!-- Body (Scrollable if needed) -->
<div class="px-margin py-margin overflow-y-auto flex-1 custom-scrollbar">
<form class="flex flex-col gap-scale-xl">
<!-- Basic Info Section -->
<div class="space-y-scale-lg">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Client Name -->
<div class="space-y-scale-sm">
<label class="font-body-sm text-body-sm text-text-secondary block" for="clientName">Client Name</label>
<input class="w-full bg-surface border border-border-strong rounded-lg px-4 py-3 font-body-md text-body-md text-text-primary placeholder-text-disabled focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="clientName" placeholder="e.g. Acme Corp" type="text">
</div>
<!-- Primary Contact -->
<div class="space-y-scale-sm">
<label class="font-body-sm text-body-sm text-text-secondary block" for="primaryContact">Primary Contact Email</label>
<input class="w-full bg-surface border border-border-strong rounded-lg px-4 py-3 font-body-md text-body-md text-text-primary placeholder-text-disabled focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" id="primaryContact" placeholder="contact@acmecorp.com" type="email">
</div>
</div>
</div>
<hr class="border-border-subtle">
<!-- Brand Kit Section -->
<div class="space-y-scale-lg">
<h3 class="font-headline-sm text-headline-sm text-text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">palette</span> Brand Kit
                        </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Colors -->
<div class="space-y-scale-md">
<div class="space-y-scale-sm">
<label class="font-body-sm text-body-sm text-text-secondary block">Primary Color</label>
<div class="relative flex items-center">
<div class="absolute left-3 w-6 h-6 rounded-full border border-border-strong bg-[#3B82F6] shadow-inner"></div>
<input class="w-full bg-surface border border-border-strong rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-text-primary uppercase tracking-wider focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" type="text" value="#3B82F6">
</div>
</div>
<div class="space-y-scale-sm">
<label class="font-body-sm text-body-sm text-text-secondary block">Secondary Color</label>
<div class="relative flex items-center">
<div class="absolute left-3 w-6 h-6 rounded-full border border-border-strong bg-[#10B981] shadow-inner"></div>
<input class="w-full bg-surface border border-border-strong rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-text-primary uppercase tracking-wider focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" type="text" value="#10B981">
</div>
</div>
</div>
<!-- Typography -->
<div class="space-y-scale-sm">
<label class="font-body-sm text-body-sm text-text-secondary block" for="typography">Typography Family</label>
<div class="relative">
<select class="w-full appearance-none bg-surface border border-border-strong rounded-lg px-4 py-3 font-body-md text-body-md text-text-primary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow cursor-pointer" id="typography">
<option selected="" value="inter">Inter (Sans-Serif)</option>
<option value="roboto">Roboto (Sans-Serif)</option>
<option value="playfair">Playfair Display (Serif)</option>
<option value="fira">Fira Code (Monospace)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-text-muted pointer-events-none">expand_more</span>
</div>
<p class="font-caption text-caption text-text-muted mt-2">Select the primary font used for client deliverables.</p>
</div>
</div>
<!-- Brand Context & Notes -->
<div class="space-y-scale-sm pt-scale-sm">
<label class="font-body-sm text-body-sm text-text-secondary block flex justify-between items-end" for="brandContext">
<span>Brand Context &amp; Notes</span>
<span class="font-caption text-caption text-text-disabled">Optional</span>
</label>
<textarea class="w-full bg-surface border border-border-strong rounded-lg px-4 py-3 font-body-md text-body-md text-text-primary placeholder-text-disabled focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow resize-none" id="brandContext" placeholder="Describe the brand voice, key demographic, or specific visual guidelines..." rows="4"></textarea>
</div>
</div>
</form>
</div>
<!-- Footer / Actions -->
<div class="px-margin py-scale-lg border-t border-border-subtle bg-surface/50 flex justify-end gap-4 shrink-0">
<button class="px-6 py-2.5 rounded-lg font-body-sm text-body-sm font-medium text-text-secondary hover:text-text-primary border border-transparent hover:bg-surface-variant transition-colors" type="button">
                    Cancel
                </button>
<button class="px-6 py-2.5 rounded-lg font-body-sm text-body-sm font-medium bg-primary text-on-primary-fixed hover:bg-primary-fixed transition-colors flex items-center gap-2 shadow-[0_0_15px_rgba(107,251,154,0.15)]" type="button">
                    Create Client
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</div>
<style>
        /* Custom scrollbar for webkit to match the dark theme */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: theme('colors.surface-variant');
            border-radius: 20px;
            border: 2px solid theme('colors.bg-elevated');
        }
    </style>
</body></html>
