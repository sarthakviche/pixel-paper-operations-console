<!-- Login Form (Visible by default) -->
<form class="form-panel form-visible w-full flex flex-col gap-scale-md" id="login-form" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-scale-xs">
<label class="font-caption text-caption text-text-secondary ml-1" for="login-email">Email Address</label>
<input class="w-full border rounded-lg px-4 py-3 font-body-md text-body-md text-text-primary placeholder-text-disabled focus:outline-none focus:border-primary input-glow transition-all" id="login-email" placeholder="name@agency.com" style="background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.05);" type="email"/>
</div>
<div class="flex flex-col gap-scale-xs">
<div class="flex justify-between items-center w-full px-1">
<label class="font-caption text-caption text-text-secondary" for="login-password">Password</label>
<a class="font-caption text-caption text-text-muted hover:text-text-primary transition-colors" href="#">Forgot?</a>
</div>
<input class="w-full border rounded-lg px-4 py-3 font-body-md text-body-md text-text-primary placeholder-text-disabled focus:outline-none focus:border-primary input-glow transition-all" id="login-password" placeholder="••••••••" style="background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.05);" type="password"/>

                Don't have an account? 
                <button class="text-primary hover:text-primary-fixed ml-1 font-medium focus:outline-none transition-colors" id="toggle-btn">Create one</button>
</p>

<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const toggleBtn = document.getElementById('toggle-btn');
            const toggleText = document.getElementById('toggle-text');
            
            let isLogin = true;

            toggleBtn.addEventListener('click', () => {
                isLogin = !isLogin;
                
                if (isLogin) {
                    // Switch to Login
                    signupForm.classList.remove('form-visible');
                    signupForm.classList.add('form-hidden');
                    
                    setTimeout(() => {
                        loginForm.classList.remove('form-hidden');
                        loginForm.classList.add('form-visible');
                    }, 50); // slight delay to allow hidden transition to start
                    
                    toggleText.innerHTML = `Don't have an account? <button id="toggle-btn" class="text-primary hover:text-primary-fixed ml-1 font-medium focus:outline-none transition-colors">Create one</button>`;
                } else {
                    // Switch to Signup
                    loginForm.classList.remove('form-visible');
                    loginForm.classList.add('form-hidden');
                    
                    setTimeout(() => {
                        signupForm.classList.remove('form-hidden');
                        signupForm.classList.add('form-visible');
                    }, 50);
                    
                    toggleText.innerHTML = `Already have an account? <button id="toggle-btn" class="text-primary hover:text-primary-fixed ml-1 font-medium focus:outline-none transition-colors">Sign in</button>`;
                }
                
                // Re-bind the newly created button in innerHTML
                document.getElementById('toggle-btn').addEventListener('click', arguments.callee);
            });
        });
    </script>
